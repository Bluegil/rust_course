name: Site quality

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-quality.yml"

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@10 site/index.html